# =============================================================================
#  X96Max+ / N1 OpenWrt 在线编译（v5·修正产物路径）
#
#  ★ 本版核心修复：armvirt → armsr/armv8
#  ------------------------------------------------------------------
#  【v2 失败的真正原因】
#    LEDE 仓库在 2025-04-28 提交 dc780ad837 "armsr: add new target from armvirt"
#    把 target/linux/armvirt 更名/重构为 target/linux/armsr（细分 armv7 / armv8）。
#    所以在当前 master(ff7be3fa21) 里 target/linux/armvirt 目录已不存在。
#    v2 沿用 haiibo 那份只写了 CONFIG_TARGET_armvirt* 的旧 config，
#    make defconfig 找不到对应 target -> 回落到默认的 x86/64
#    -> 编译“成功”但产物是 bin/targets/x86/64（纯 x86，根本不是 ARM 固件）。
#
#  【正确做法】
#    target = armsr，subtarget = armv8，device = generic
#    产物路径 = bin/targets/armsr/armv8/*rootfs.tar.gz
#    对应关系：armvirt/64  ==  armsr/armv8   （同一套东西，改了名）
#
#  另：校验阶段会检测 bin/targets/x86 目录，一旦出现立即判失败，
#      避免“编译成功但架构错误”再次发生。
# =============================================================================
name: Build OpenWrt for N1 & X96Max+ (v5)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "内核（系列号；6.1.y=默认。可多写如 6.1.y_6.12.y）"
        required: true
        default: "6.1.y"
      openwrt_ver:
        description: "固件版本号（决定产物文件名）"
        required: true
        default: "R24.1.13"
      lede_commit:
        description: "锁定 LEDE 提交（留空=用 LEDE_FALLBACK_COMMIT）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  LEDE_FALLBACK_COMMIT: ff7be3fa21cae4277a0b2e8d6653b8acce8ac236
  HAI_RAW: https://raw.githubusercontent.com/haiibo/OpenWrt/main

jobs:
  build-rootfs:
    name: 1. 编译 armsr/armv8 rootfs
    runs-on: ubuntu-22.04
    steps:
      - name: 检查磁盘与内存
        run: |
          free -h
          df -h /
          echo "根分区可用空间（MB）: $(df -m --output=avail / | tail -n1)"

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs \
            msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev time

      - name: 拉取 LEDE 源码
        run: |
          if [ -n "${{ inputs.lede_commit }}" ]; then
            git clone --filter=blob:none $REPO_URL -b $REPO_BRANCH openwrt
            cd openwrt && git checkout ${{ inputs.lede_commit }}
          else
            git clone $REPO_URL -b $REPO_BRANCH openwrt
            cd openwrt && git checkout $LEDE_FALLBACK_COMMIT
          fi
          echo "== 实际 LEDE commit =="
          git rev-parse HEAD

      # ============================================================
      # ★ 关键前置检查：确认 armvirt 已更名，armsr 确实存在
      # ============================================================
      - name: 确认 ARM target 可用（armvirt → armsr）
        run: |
          cd openwrt
          echo "== 检测 target/linux 下的 ARM 通用 target =="
          if [ -d target/linux/armvirt ]; then
            echo "::notice::本 commit 仍保留 armvirt（未更名）"
          else
            echo "::notice::armvirt 已不存在（预期内，见 v3 注释）"
          fi
          ls -d target/linux/armsr 2>/dev/null || {
            echo "::error::连 armsr 也没有，此 commit 结构异常，请更换 lede_commit"
            exit 1
          }
          echo "== armsr 子目录 =="
          ls -1 target/linux/armsr/
          echo "== BOARD 定义 =="
          grep -E '^(BOARD|BOARDNAME|KERNEL_PATCHVER)' target/linux/armsr/Makefile || true
          echo "== 可用特性（应含 cpiogz/targz → rootfs.tar.gz 由此产生）=="
          grep -E '^FEATURES' target/linux/armsr/Makefile || true

      - name: 套用 haiibo ARMv8_PLUS 配置与脚本
        run: |
          cd openwrt
          wget -O .config ${HAI_RAW}/configs/armv8-plus.config
          mkdir -p images scripts
          wget -O diy-script.sh   ${HAI_RAW}/diy-script.sh
          wget -O images/bg1.jpg  ${HAI_RAW}/images/bg1.jpg
          for f in init-settings.sh preset-clash-core.sh preset-terminal-tools.sh \
                   011-fix-mbo-modules-build.patch; do
            wget -O scripts/$f ${HAI_RAW}/scripts/$f
          done
          chmod +x diy-script.sh scripts/*.sh
          echo "== haiibo config 里的 target 行 =="
          grep -E '^CONFIG_TARGET' .config || true

      - name: 应用插件集
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          export GITHUB_WORKSPACE="$PWD"
          wget -O scripts/.zshrc ${HAI_RAW}/scripts/.zshrc || true
          [ -f scripts/011-fix-mbo-modules-build.patch ] || \
            wget -O scripts/011-fix-mbo-modules-build.patch ${HAI_RAW}/scripts/011-fix-mbo-modules-build.patch

          # PassWall 已从 xiaorouji/ 迁移到 Openwrt-Passwall/
          sed -i 's#xiaorouji/openwrt-passwall-packages#Openwrt-Passwall/openwrt-passwall-packages#g;
                  s#xiaorouji/openwrt-passwall2#Openwrt-Passwall/openwrt-passwall2#g;
                  s#xiaorouji/openwrt-passwall\b#Openwrt-Passwall/openwrt-passwall#g' diy-script.sh
          grep -n 'passwall' diy-script.sh

          sed -i 's/^git clone \(.*\)$/git clone \1 || true/; s/^git_sparse_clone \(.*\)$/git_sparse_clone \1 || true/' diy-script.sh

          ./diy-script.sh
          ./scripts/preset-clash-core.sh arm64 || echo "::warning::clash 核心下载失败"
          ./scripts/preset-terminal-tools.sh || echo "::warning::终端工具下载失败"

      # ============================================================
      # ★ 核心修复：armvirt → armsr/armv8
      # ============================================================
      - name: 锁定编译目标为 armsr/armv8（核心修复）
        run: |
          cd openwrt
          sed -i '/^CONFIG_TARGET_armvirt/d' .config
          for kv in \
            "CONFIG_TARGET_armsr=y" \
            "CONFIG_TARGET_armsr_armv8=y" \
            "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y" \
            "CONFIG_TARGET_BOARD=armsr" \
            "CONFIG_TARGET_SUBTARGET=armv8" \
            "CONFIG_TARGET_ARCH_PACKAGES=\"armsr-armv8\"" \
            "CONFIG_TARGET_ARCH=aarch64_generic" \
            "CONFIG_TARGET_MULTILIB=y" \
            "CONFIG_TARGET_ALL_KERNELARCHS=y" \
            "CONFIG_TARGET_ARCH_WORDSIZE=64" \
            ; do
            k="${kv%%=*}"; v="${kv#*=}"
            sed -i "/^${k}=/d;/^# ${k} is not set$/d" .config
            echo "${k}=${v}" >> .config
          done
          make defconfig

          # ------------------------------------------------------------
          # ★ 关键修复（v4）：haiibo 的 armv8-plus.config 把所有 rootfs
          #   格式都禁用了：
          #     # CONFIG_TARGET_ROOTFS_CPIOGZ is not set
          #     # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
          #     # CONFIG_TARGET_IMAGES_GZIP is not set
          #   而 armsr 的 FEATURES 明明写着 "cpiogz ext4 ramdisk squashfs targz"，
          #   rootfs.tar.gz 正是由 targz 产出。全部禁用 => make 正常跑完、
          #   target/install 也执行，但 bin/targets/armsr/armv8/ 下**一个文件都没有**。
          #   这就是 v3 编了2.5 小时却在第13步"未找到 rootfs"的真正原因。
          # ------------------------------------------------------------
          echo "===== 启用 rootfs 输出格式 ====="
          #★ 关键：真正控制 rootfs.tar.gz 的是 CONFIG_TARGET_ROOTFS_TARGZ
          #（include/image.mk: `ifdef CONFIG_TARGET_ROOTFS_TARGZ / define Image/Build/targz`
          #   且 kernel_prepare 阶段会直接 `$(call Image/Build/targz)`）。
          #   v3 失败就是因为 haiibo config 里没有这一项。
          for kv in \
            "CONFIG_TARGET_ROOTFS_TARGZ=y" \
            "CONFIG_TARGET_ROOTFS_CPIOGZ=y" \
            "CONFIG_TARGET_ROOTFS_EXT4FS=y" \
            "CONFIG_TARGET_ROOTFS_SQUASHFS=y" \
            "CONFIG_TARGET_IMAGES_GZIP=y" \
            ; do
            k="${kv%%=*}"; v="${kv#*=}"
            sed -i "/^${k}=/d;/^# ${k} is not set$/d" .config
            echo "${k}=${v}" >> .config
          done
          make defconfig
          echo "--- 生效确认（应全部 =y）---"
          for k in CONFIG_TARGET_ROOTFS_TARGZ CONFIG_TARGET_ROOTFS_CPIOGZ \
                   CONFIG_TARGET_ROOTFS_SQUASHFS CONFIG_TARGET_IMAGES_GZIP; do
            grep -E "^${k}=" .config || echo "MISS $k"
          done

          echo "===== target 校验 ====="
          fail=0
          for k in CONFIG_TARGET_armsr CONFIG_TARGET_armsr_armv8 \
                   CONFIG_TARGET_armsr_armv8_DEVICE_generic CONFIG_TARGET_BOARD CONFIG_TARGET_SUBTARGET; do
            if grep -qE "^${k}=" .config; then
              echo "OK   $(grep -E "^${k}=" .config)"
            else
              echo "MISS $k"; fail=1
            fi
          done
          echo "----- ARCH -----"
          grep -E '^CONFIG_TARGET_(ARCH|ARCH_PACKAGES|ARCH_WORDSIZE)' .config || true
          echo "----- ROOTFS 格式（关键，必须为 y 才有产出）-----"
          for k in CONFIG_TARGET_ROOTFS_CPIOGZ CONFIG_TARGET_ROOTFS_SQUASHFS CONFIG_TARGET_IMAGES_GZIP; do
            if grep -qE "^${k}=y" .config; then echo "OK   $k=y"; else echo "MISS $k"; fail=1; fi
          done
          echo "----- 确认没有 x86 混入 -----"
          if grep -qE '^CONFIG_TARGET_(x86|PC|x86_64)' .config; then
            echo "::error::x86 target 混入！"; fail=1
          else
            echo "OK   无 x86"
          fi
          [ $fail -eq 0 ] || { echo "::error::配置不完整，终止"; exit 1; }
          echo "== target + rootfs 格式锁定成功 =="

      - name: 移除 haiibo 的 ARM 编译参数覆盖
        run: |
          cd openwrt
          # armv8-plus.config 的 CONFIG_TARGET_OPTIMIZATION 带 -march=armv8-a+crypto，
          # 会污染 host 版 libgcc 编译 -> cannot compute suffix of object files
          sed -i '/^CONFIG_TARGET_OPTIMIZATION=/d' .config
          sed -i 's#^CONFIG_PACKAGE_adb=y#\# CONFIG_PACKAGE_adb is not set#' .config
          grep -E '^CONFIG_TARGET_OPTIMIZATION|^#? CONFIG_PACKAGE_adb( |$)' .config || true

      - name: 启用 perl 模块
        run: |
          cd openwrt
          for s in CONFIG_PACKAGE_perlbase-file CONFIG_PACKAGE_perlbase-getopt \
                   CONFIG_PACKAGE_perlbase-time CONFIG_PACKAGE_perlbase-unicode \
                   CONFIG_PACKAGE_perlbase-utf8; do
            sed -i "/^# ${s} is not set$/d" .config
            grep -q "^${s}=" .config || echo "${s}=y" >> .config
          done

      - name: 补齐 F 大打包必选包
        run: |
          cd openwrt
          has_symbol() { grep -qE "^CONFIG_PACKAGE_${1}=|^# CONFIG_PACKAGE_${1} is not set" .config; }
          force_pkg() {
            if has_symbol "$1"; then
              sed -i "/^# CONFIG_PACKAGE_${1} is not set$/d" .config
              grep -q "^CONFIG_PACKAGE_${1}=" .config || echo "CONFIG_PACKAGE_${1}=y" >> .config
              echo "OK   $1"
            else
              echo "::warning::CONFIG_PACKAGE_$1 不存在，跳过"
            fi
          }
          for p in e2fsprogs mkf2fs perl perlbase-file perlbase-getopt perlbase-time \
                   perlbase-unicode perlbase-utf8 blkid fdisk lsblk parted attr btrfs-progs \
                   chattr dosfstools f2fs-tools f2fsck lsattr xfs-fsck xfs-mkfs bsdtar pigz \
                   bash gawk getopt losetup tar uuidgen acpid kmod-brcmfmac kmod-brcmutil \
                   kmod-cfg80211 kmod-mac80211 hostapd-common iw wpad; do
            force_pkg "$p"
          done
          # 消除 kmod-oaf 递归依赖告警（destan19/OpenAppFilter 的 Kconfig 自我 select）
          sed -i '/^CONFIG_PACKAGE_kmod-oaf=y/d' .config
          make defconfig
          echo "== 最终自检 =="
          miss=0
          for p in perl perlbase-file perlbase-getopt perlbase-time perlbase-unicode perlbase-utf8 \
                   blkid fdisk lsblk parted attr btrfs-progs chattr dosfstools e2fsprogs f2fs-tools \
                   f2fsck lsattr mkf2fs xfs-fsck xfs-mkfs bsdtar pigz bash gawk getopt losetup tar \
                   uuidgen acpid kmod-brcmfmac kmod-brcmutil kmod-cfg80211 kmod-mac80211 \
                   hostapd-common iw wpad; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || { echo "MISS ${p}"; miss=1; }
          done
          [ $miss -eq 0 ] && echo "必选包自检通过" || echo "::warning::有包缺失"
          echo "===== 再次确认 target 未被 defconfig 丢掉 ====="
          grep -E '^CONFIG_TARGET_(armsr|BOARD|SUBTARGET|ARCH)=' .config
          # ★ 最后一道防线：确认 rootfs 输出格式仍在（defconfig 可能重置）
          echo "===== 再次确认 rootfs 格式未被丢掉 ====="
          rmiss=0
          for k in CONFIG_TARGET_ROOTFS_TARGZ CONFIG_TARGET_IMAGES_GZIP; do
            if grep -qE "^${k}=y" .config; then echo "OK   $k=y"; else echo "MISS $k（重新写入并 defconfig）"; rmiss=1; fi
          done
          if [ "$rmiss" -ne 0 ]; then
            echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
            echo "CONFIG_TARGET_IMAGES_GZIP=y" >> .config
            make defconfig
            echo "--- 补写后 ---"; grep -E '^CONFIG_TARGET_ROOTFS_TARGZ=|^CONFIG_TARGET_IMAGES_GZIP=' .config
          fi

      - name: 编译
        run: |
          cd openwrt
          set -o pipefail
          make -j$(nproc) download 2>&1 | tee /tmp/download.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行 download 有失败项，串行重试"
            make download 2>&1 | tee /tmp/download2.log
            rc2=${PIPESTATUS[0]}
            [ "$rc2" -ne 0 ] && { echo "::error::download 持续失败"; grep -naE "Failed to download|wget returned" /tmp/download2.log | tail -20 || true; exit 1; }
          fi
          echo "== 开始编译（约 2~3 小时）=="
          # 用 PIPESTATUS 判定，不能用 `if ! cmd | tee`（bash 中 ! 作用于 tee 的退出码）
          make -j$(nproc) 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::编译失败（rc=$rc），错误摘要："
            grep -naE '(^|: )(error|Error|ERROR):|No such file|cannot |undefined reference|Build failed' /tmp/build.log | tail -40 || true
            exit 1
          fi
          echo "== 编译完成 =="

      # ============================================================
      # ★ 架构硬校验 + targz rootfs 生成（v4 关键修复）
      # ============================================================
      - name: 生成 targz rootfs 并校验产物
        run: |
          cd openwrt
          # ------------------------------------------------------------
          # v3 失败原因：bin/targets/armsr/armv8/ 下【一个文件都没有】。
          #   原因有二：
          #     (1) haiibo config 把所有 rootfs 格式禁用（已在上一步开启）
          #     (2) armsr/image/Makefile 只定义了 Build/combined（EFI 镜像），
          #         没有 rootfs-targz 目标，所以默认 make 不会产出 rootfs.tar.gz。
          #   而 flippy 打包必须要这个文件（脚本里写死 PACKAGE_FILE=
          #   "openwrt-armsr-armv8-generic-rootfs.tar.gz"，仅拷贝不生成）。
          # 解法：显式调用 Build/rootfs-targz 目标。
          # ------------------------------------------------------------

          echo "===== 当前 bin/targets 状态 ====="
          find bin/targets -maxdepth 3 2>/dev/null | head -20 || true

          # 开启 CONFIG_TARGET_ROOTFS_TARGZ 后，make 的 kernel_prepare 阶段
          # 会自动执行 `$(call Image/Build/targz)`，正常情况下产物已存在。
          # 兜底：若仍无，再显式调一次。
          if ! ls bin/targets/armsr/armv8/*rootfs*.tar.gz >/dev/null 2>&1; then
            echo "::notice::未找到 targz rootfs，尝试显式make image"
            make image V=s 2>&1 | tee /tmp/image.log || {
              echo "::warning::make image 返回非零，继续用现有产物查找"
            }
          else
            echo "::notice::已找到 targz rootfs，跳过 make image"
            touch /tmp/image.log
          fi

          echo "===== 生成后的产物 ====="
          ls -lh bin/targets/armsr/armv8/ 2>/dev/null || true
          find bin -name '*rootfs*' 2>/dev/null | head -10 || true

          # ---- 架构硬校验 ----
          if [ -d bin/targets/x86 ]; then
            echo "::error::检测到 bin/targets/x86 —— 编成了 x86 而非 ARM"
            exit 1
          fi

          # ---- 定位 rootfs（兼容多种命名）----
          f=""
          for cand in \
            bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz \
            bin/targets/armsr/armv8/*rootfs*.tar.gz \
            bin/targets/armsr/armv8/*rootfs*.img \
            bin/targets/armsr/armv8/*combined*.img.gz ; do
            if [ -f "$cand" ]; then f="$cand"; break; fi
          done
          if [ -z "$f" ]; then
            f=$(find bin -name '*rootfs*.tar.gz' -size +1M 2>/dev/null | head -n1)
          fi
          if [ -z "$f" ]; then
            f=$(find bin -name '*.img*' -size +10M 2>/dev/null | head -n1)
          fi

          if [ -z "$f" ]; then
            echo "::error::仍未找到任何 rootfs / 镜像产物。"
            echo "::error:: bin/targets/armsr/armv8/ 实际内容："
            ls -laR bin/targets/armsr/ 2>/dev/null | head -40 || true
            echo "::error:: 可用 Build 目标："
            grep -oE "^define Build/[a-z-]+" target/linux/armsr/image/Makefile include/image.mk 2>/dev/null
            exit 1
          fi

          # v4 失败点修正：统一把产物落到固定绝对路径 /tmp/rootfs/，
          # 并把【绝对路径】写入 rootfs_path.txt。
          # 上一版写的是 bin/targets/... 这样的相对路径，而下一 step不再 cd openwrt，
          # 导致 `test -f` 判定"路径失效"（rootfs 其实已 copy 到 /tmp/rootfs/ 了）。
          mkdir -p /tmp/rootfs
          FINAL=/tmp/rootfs/openwrt-armsr-armv8-generic-rootfs.tar.gz
          echo "== 复制到固定位置 =="
          cp -vf "$f" "$FINAL"
          rm -f /tmp/rootfs/*.img /tmp/rootfs/*.img.gz 2>/dev/null || true

          sz=$(du -b "$FINAL" | awk '{print $1}')
          echo "FOUND_ROOTFS=$FINAL  size=$sz"
          [ "$sz" -ge 10485760 ] || { echo "::error::产物过小（<10MB），疑似损坏"; exit 1; }
          echo "== /tmp/rootfs 内容 =="
          ls -lh /tmp/rootfs/
          echo "$FINAL" > /tmp/rootfs_path.txt

      - name: 取出 rootfs（校验）
        run: |
          set -e
          f=$(cat /tmp/rootfs_path.txt)
          echo "rootfs 路径: $f"
          test -f "$f" || { echo "::error::rootfs 不存在: $f"; exit 1; }
          ls -lh "$f"
          # 校验是合法的 gzip tar
          tar tzf "$f" >/dev/null 2>&1 || { echo "::error::rootfs 不是有效的 tar.gz"; exit 1; }
          echo "rootfs 校验通过"

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: |
            /tmp/build.log
            /tmp/image.log
          retention-days: 14

      - name: 上传 rootfs
        uses: actions/upload-artifact@v5
        with:
          name: openwrt-rootfs
          path: /tmp/rootfs/openwrt-armsr-armv8-generic-rootfs.tar.gz
          compression-level: 0
          retention-days: 3

  package:
    name: 2. F 大脚本打包 N1 + X96Max+
    needs: [build-rootfs]
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 rootfs
        uses: actions/download-artifact@v5
        with:
          name: openwrt-rootfs
          path: rootfs

      - name: 安装打包依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y btrfs-progs dosfstools e2fsprogs util-linux uuid-runtime \
            fdisk parted gawk tar pigz p7zip-full rsync wget curl
          ls -lh rootfs/

      - name: 调用 F 大打包脚本
        uses: ophub/flippy-openwrt-actions@main
        env:
          PACKAGE_SOC: s905x3_s905d
          # v4：文件名与 flippy 脚本内 PACKAGE_FILE 保持一致
          OPENWRT_ARMSR: rootfs/openwrt-armsr-armv8-generic-rootfs.tar.gz
          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: ${{ inputs.kernel_version }}
          KERNEL_AUTO_LATEST: 'true'
          WHOAMI: Haiibo
          OPENWRT_VER: ${{ inputs.openwrt_ver }}
          DISTRIB_REVISION: ${{ inputs.openwrt_ver }}
          OPENWRT_IP: 192.168.1.1
          GZIP_IMGS: gz

      - name: 收集产物
        run: |
          mkdir -p firmware
          cp -v "${PACKAGED_OUTPUTPATH}"/*.img.gz firmware/ 2>/dev/null || true
          cp -v "${PACKAGED_OUTPUTPATH}"/*.sha256 firmware/ 2>/dev/null || true
          if [ -z "$(ls -A firmware)" ]; then
            echo "::error::没有产出镜像，请翻日志找报错"
            exit 1
          fi
          ls -lh firmware/

      - name: 发布到 Release
        uses: ncipollo/release-action@v1
        with:
          tag: OpenWrt-Flippy-v3
          name: "OpenWrt v3 (armsr/armv8) for N1 & X96Max+"
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: false
          artifacts: firmware/*
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### 本次编译（v3·armsr/armv8 修正版）
            - target: **armsr / armv8**（原 armvirt/64 已于 2025-04-28 更名）
            - LEDE commit: 已锁定，可复现
            - 插件集: haiibo ARMv8_PLUS
            - 内核: ${{ inputs.kernel_version }}
            - 目标: s905x3 (X96Max+ 等) 、 s905d (Phicomm N1)
            - 默认地址/密码: 192.168.1.1 / password
            - 刷机: U 盘启动 → 系统 → 晶晨宝盒 → 安装 OpenWrt
# =============================================================================
#  X96Max+ / N1 OpenWrt 在线编译（v12·修缓存路径与 CCACHE_DIR + 分层校验 + 自动重试）
#
#  ★ v10 三项改动
#  ------------------------------------------------------------------
#  1) 强制重建 tmp/.packageinfo（少插件的真正根因）
#     该文件是 mtime 增量缓存。本job 里 update feeds 先触发了 metadata 扫描，
#     之后才 clone package/ 下的插件 → 新目录从未进索引 → Kconfig 不认识这些符号
#     → make defconfig 把它们当未知行静默丢弃（连 "is not set" 都不产生）。
#     v9 实测证据：全日志 "Collecting package info: package/" 命中数 = 0，
#     而 .config 里存活的 ssr-plus/turboacc/ddns 全部来自 feeds/。
#
#  2) 多级嵌套包拍平
#     sbwml/luci-app-alist 真实结构是 package/luci-app-alist/alist/luci-app-alist/
#     （两层壳）。OpenWrt 只扫 package/*/Makefile 一层，v6~v9 的同名前缀拍平
#     对它无效 → alist 从未进Kconfig。现改为 find -maxdepth 3 递归兜底。
#
#  3) 编译提速（保证 6 小时内跑完）
#     - actions/checkout 不再删历史（--depth=1 会让 git 操作更慢）
#     - ccache：官方 haiibo 用 ccache: false，但首次编译无缓存时差别不大；
#       这里启用 ccache 并做跨 run 缓存，第二次起可省30~50% 编译时间
#     - dl/ 源码包缓存：避免每次重新下载（官方 make download 是独立步骤）
#     - timeout-minutes: 340留出余量，避免撞 GitHub 6 小时硬上限被判定失败
#
#  【历史耗时参考】
#    v3 编译步实测 2h22m（但那次 config 缺 rootfs 格式、插件不全）
#    v4 全程93 min    v7/v9 均在 5min 内挂在配置校验
#    插件补齐 + 123 个 luci-app 后，预计 2.5~4h，处于 6h 上限内
# =============================================================================
name: Build OpenWrt for N1 & X96Max+ (v12)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "内核（系列号；6.1.y=默认。可多写如 6.1.y_6.12.y）"
        required: true
        default: "6.1.y"
      openwrt_ver:
        description: "固件版本号（决定产物文件名）"
        required: true
        default: "R24.1.13"
      lede_commit:
        description: "锁定 LEDE 提交（留空=用 LEDE_FALLBACK_COMMIT）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  LEDE_FALLBACK_COMMIT: ff7be3fa21cae4277a0b2e8d6653b8acce8ac236
  HAI_RAW: https://raw.githubusercontent.com/haiibo/OpenWrt/main

jobs:
  build-rootfs:
    name: 1. 编译 armsr/armv8 rootfs
    runs-on: ubuntu-22.04
    # ★ 6 小时硬约束保护：设340 min 留 20 min 余量。
    #   timeout-minutes 必须挂在 job 上（挂工作流顶层会解析失败）。
    #   公开仓库单 job 上限 6h，超时判失败且拿不到任何产物；
    #   留出的 20 min 用于上传产物与日志。
    timeout-minutes: 340
    steps:
      - name: 检查磁盘与内存
        run: |
          free -h
          df -h /
          echo "根分区可用空间（MB）: $(df -m --output=avail / | tail -n1)"

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs \
            msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev time

      # ★ v11 提速修正：ccache 跨 run 缓存
      #   v10 的两个错误已修：
      #     1) path 写 ~/.ccache，但编译步骤用的是 ${{github.workspace }}/.ccache
      #        —— 存取路径不一致，等于永远不命中
      #     2) key 里带 ${{ github.run_id }}，每次 run 都是全新 key，
      #        主键永不命中（只靠 restore-keys 兜），等于没有缓存
      #   现在：路径统一 +主键稳定（用 run 序号做前缀，保证并发安全）
      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}-${{ inputs.kernel_version }}
          restore-keys: |
            ccache-${{ inputs.kernel_version }}
            ccache-

      - name: 配置 ccache
        run: |
          # ★ 必须先建目录：缓存未命中时 actions/cache 不会创建目录，
          #   导致后续 ccache -M 失败并让整个 step 挂掉（v11 实测踩过）
          mkdir -p "${{ github.workspace }}/.ccache" "${{ github.workspace }}/.ccache/tmp"
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          ccache -M 20G || echo "::warning::ccache -M 失败（忽略，不阻断）"
          ccache -z || echo "::warning::ccache -z 失败（忽略）"
          ccache -s 2>/dev/null | head -10 || echo "::warning::ccache -s 失败（忽略）"

      # ★ v11 提速：源码包（openwrt/dl/）跨 run 缓存
      #   同样修正 key 含 run_id 的问题
      - name: 恢复 dl 源码包缓存
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ github.run_id }}-${{ inputs.kernel_version }}
          restore-keys: |
            dl-${{ inputs.kernel_version }}
            dl-

      - name: 拉取 LEDE 源码
        run: |
          if [ -n "${{ inputs.lede_commit }}" ]; then
            git clone --filter=blob:none $REPO_URL -b $REPO_BRANCH openwrt
            cd openwrt && git checkout ${{ inputs.lede_commit }}
          else
            git clone $REPO_URL -b $REPO_BRANCH openwrt
            cd openwrt && git checkout $LEDE_FALLBACK_COMMIT
          fi
          echo "== 实际 LEDE commit =="
          git rev-parse HEAD

      # ============================================================
      # ★ 关键前置检查：确认 armvirt 已更名，armsr 确实存在
      # ============================================================
      - name: 确认 ARM target 可用（armvirt → armsr）
        run: |
          cd openwrt
          echo "== 检测 target/linux 下的 ARM 通用 target =="
          if [ -d target/linux/armvirt ]; then
            echo "::notice::本 commit 仍保留 armvirt（未更名）"
          else
            echo "::notice::armvirt 已不存在（预期内，见 v3 注释）"
          fi
          ls -d target/linux/armsr 2>/dev/null || {
            echo "::error::连 armsr 也没有，此 commit 结构异常，请更换 lede_commit"
            exit 1
          }
          echo "== armsr 子目录 =="
          ls -1 target/linux/armsr/
          echo "== BOARD 定义 =="
          grep -E '^(BOARD|BOARDNAME|KERNEL_PATCHVER)' target/linux/armsr/Makefile || true
          echo "== 可用特性（应含 cpiogz/targz → rootfs.tar.gz 由此产生）=="
          grep -E '^FEATURES' target/linux/armsr/Makefile || true

      - name: 套用 haiibo ARMv8_PLUS 配置与脚本
        run: |
          cd openwrt
          wget -O .config ${HAI_RAW}/configs/armv8-plus.config
          mkdir -p images scripts
          wget -O diy-script.sh   ${HAI_RAW}/diy-script.sh
          wget -O images/bg1.jpg  ${HAI_RAW}/images/bg1.jpg
          for f in init-settings.sh preset-clash-core.sh preset-terminal-tools.sh \
                   011-fix-mbo-modules-build.patch; do
            wget -O scripts/$f ${HAI_RAW}/scripts/$f
          done
          chmod +x diy-script.sh scripts/*.sh
          echo "== haiibo config 里的 target 行 =="
          grep -E '^CONFIG_TARGET' .config || true

      - name: 应用插件集
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          export GITHUB_WORKSPACE="$PWD"
          wget -O scripts/.zshrc ${HAI_RAW}/scripts/.zshrc || true
          [ -f scripts/011-fix-mbo-modules-build.patch ] || \
            wget -O scripts/011-fix-mbo-modules-build.patch ${HAI_RAW}/scripts/011-fix-mbo-modules-build.patch

          # PassWall 已从 xiaorouji/ 迁移到 Openwrt-Passwall/
          sed -i 's#xiaorouji/openwrt-passwall-packages#Openwrt-Passwall/openwrt-passwall-packages#g;
                  s#xiaorouji/openwrt-passwall2#Openwrt-Passwall/openwrt-passwall2#g;
                  s#xiaorouji/openwrt-passwall\b#Openwrt-Passwall/openwrt-passwall#g' diy-script.sh
          grep -n 'passwall' diy-script.sh

          sed -i 's/^git clone \(.*\)$/git clone \1 || true/; s/^git_sparse_clone \(.*\)$/git_sparse_clone \1 || true/' diy-script.sh

          ./diy-script.sh
          ./scripts/preset-clash-core.sh arm64 || echo "::warning::clash 核心下载失败"
          ./scripts/preset-terminal-tools.sh || echo "::warning::终端工具下载失败"

      # ============================================================
      # ★★ v5 关键修复：拍平嵌套插件目录 + 完整性校验
      #   v4 实测：编译阶段 package/ 下只编了 package/base-files 一个包，
      #   60+ 个第三方插件（passwall/passwall2/openclash/mosdns/smartdns/alist…）
      #   **一个都没被编译**，rootfs 只有 148MB（官方那份 394MB/1317 包）。
      #   原因：diy-script.sh 用 `git clone <repo> package/luci-app-passwall`，
      #   而 Openwrt-Passwall/openwrt-passwall 仓库顶层又是一层luci-app-passwall/，
      #   于是路径变成 package/luci-app-passwall/luci-app-passwall/Makefile，
      #   多一层 → OpenWrt 扫描 package/ 时完全看不到该包 → 静默跳过。
      # ============================================================
      - name: 拍平插件目录并校验完整性
        run: |
          cd openwrt
          #★ v6 修正：只处理【第三方插件目录】，绝不碰 OpenWrt 官方分类目录。
          #   v6 初版把 package/kernel、package/libs、package/devel 也当成
          #   "嵌套目录"去改名，会破坏官方包结构 —— 那三个是OpenWrt 的
          #   固定分类目录（kernel/ libs/ devel/ utils/ network/ …），
          #   本来就没有自己的 Makefile，是正常的。
          #   判据：只处理"内层目录名 == 外层目录名"的同名前缀嵌套，
          #   这才是"仓库多包了一层壳"的特征。
          OFFICIAL="kernel libs devel utils network telephony base-files target toolchain firmware utils"

          echo "===== 检测真正的嵌套（内层名==外层名）====="
          for d in package/*/; do
            n=$(basename "$d")
            [ -f "package/$n/Makefile" ] && continue
            case " $OFFICIAL " in *" $n "*) continue ;; esac   # 官方目录跳过
            # 只认「内层目录名与外层同名」这一种嵌套形态
            if [ -f "package/$n/$n/Makefile" ]; then
              echo "  嵌套!  $n/$n"
            fi
          done

          echo "===== 执行拍平（仅同名前缀嵌套）====="
          for d in package/*/; do
            n=$(basename "$d")
            [ -f "package/$n/Makefile" ] && continue
            case " $OFFICIAL " in *" $n "*) continue ;; esac
            if [ -f "package/$n/$n/Makefile" ]; then
              echo "  拍平 $n"
              mv "package/$n/$n" "package/.flat_$n" && rm -rf "$d" && mv "package/.flat_$n" "package/$n"
              [ -f "package/$n/Makefile" ] && echo "    OK package/$n/Makefile" || echo "    ::error::拍平失败 $n"
            fi
          done

          echo "===== 处理 OpenAppFilter（特例：外层名≠ 内层包名）====="
          # OpenAppFilter 仓库顶层 = luci-app-oaf/，被克隆到 package/OpenAppFilter
          if [ -d package/OpenAppFilter ] && [ ! -f package/OpenAppFilter/Makefile ]; then
            for inner in package/OpenAppFilter/*/; do
              im=$(basename "$inner")
              [ -f "package/OpenAppFilter/$im/Makefile" ] || continue
              echo "  发现内层包: $im"
              mv "$inner" "package/$im" && echo "    -> package/$im"
              rm -rf package/OpenAppFilter
              break
            done
          fi

          # ★ v10 新增：处理【多级嵌套】包
          #   实测 sbwml/luci-app-alist 的真实结构是：
          #     package/luci-app-alist/alist/luci-app-alist/Makefile   ← 两层！
          #   上面的同名前缀拍平只处理 package/<n>/<n>/Makefile 一层，
          #   对 alist 这种「壳/子目录/包」三层结构无效，
          #   结果 alist 一直没进 Kconfig（v9 实测 Collecting 命中 0）。
          #   这里用 find递归兜底：任意深度找到 <包名>/Makefile 就提升到 package/ 顶层。
          echo "===== 处理多级嵌套包（任意深度兜底）====="
          for k in luci-app-alist luci-app-mosdns luci-app-passwall \
                   luci-app-passwall2 luci-app-ssr-plus luci-app-openclash \
                   luci-app-smartdns; do
            [ -f "package/$k/Makefile" ] && continue          # 已在一层，无需处理
            [ -d "package/$k" ] || continue# 未 clone
            # 递归找名为 $k 且含 Makefile 的目录（深度 1~3）
            inner_path=$(find "package/$k" -maxdepth 3 -type d -name "$k" 2>/dev/null \
                         | while read -r d; do
                             [ -f "$d/Makefile" ] && { echo "$d"; break; }
                           done | head -1)
            if [ -n "$inner_path" ]; then
              echo "  多级嵌套: $inner_path"
              mv "$inner_path" "package/.flat_$k" && rm -rf "package/$k" \
                 && mv "package/.flat_$k" "package/$k"
              if [ -f "package/$k/Makefile" ]; then
                echo "    OK 已提升到 package/$k/Makefile"
              else
                echo "    ::error::提升失败 $k"
              fi
            fi
          done

          echo "===== 处理 mosdns（仓库顶层即多包，需整体放入但保证可被扫到）====="
          # package/luci-app-mosdns 内是 geo2txt 等子包；
          # sbwml/luci-app-mosdns 顶层 = luci-app-mosdns/，同名前缀，已在上面拍平。
          # 这里只做存在性确认。
          [ -d package/luci-app-mosdns ] && echo "  luci-app-mosdns: $([ -f package/luci-app-mosdns/Makefile ] && echo 已可识别 || echo '内层: '$(ls package/luci-app-mosdns | head -3 | tr '\n' ' '))"

          echo "===== 拍平后：有 Makefile 的第三方包 ====="
          cnt=0
          for d in package/*/; do
            n=$(basename "$d")
            case " $OFFICIAL " in *" $n "*) continue ;; esac
            if [ -f "package/$n/Makefile" ]; then cnt=$((cnt+1)); echo "  OK   $n"; fi
          done
          echo "  可识别的第三方包总数: $cnt"
          if [ "$cnt" -lt 10 ]; then
            echo "::error::可识别第三方包过少（$cnt < 10）"
            echo "::error::package/ 下目录与 Makefile 现状："
            for d in package/*/; do
              n=$(basename "$d")
              echo "   $n : $([ -f "package/$n/Makefile" ] && echo OK || echo '无 Makefile') | 内层: $(ls "$d" 2>/dev/null | head -3 | tr '\n' ' ')"
            done
            exit 1
          fi

          # ★ v10 修复：强制重建 packageinfo 索引
          #   根因：tmp/.packageinfo 是 mtime 增量缓存。本job 里
          #   update feeds 先触发了一次 metadata 扫描，之后才 clone
          #   package/ 下的插件，这些新目录从未进入索引，Kconfig 不认识它们，
          #   make defconfig 会把它们当未知符号静默丢弃（连 is not set 都不产生）。
          #   实测证据：v9 全日志 "Collecting package info: package/" 命中数 = 0，
          #   而 .config 里存活的 ssr-plus/turboacc/ddns 全部来自 feeds/。
          echo "===== 强制重建 packageinfo 索引 ====="
          rm -f tmp/.packageinfo tmp/.config-package.in
          rm -rf tmp/info
          make defconfig >/dev/null 2>&1 || true
          echo "  索引重建后，package/ 收录情况："
          idx_ok=0; idx_bad=0
          for d in package/*/; do
            n=$(basename "$d")
            case " $OFFICIAL " in *" $n "*) continue ;; esac
            [ -f "package/$n/Makefile" ] || continue
            if grep -q "^Package: $n\$" tmp/.packageinfo 2>/dev/null; then
              echo "    [索引OK] $n"; idx_ok=$((idx_ok+1))
            else
              echo "    [索引缺] $n   <<< Kconfig 仍不认识此包"; idx_bad=$((idx_bad+1))
            fi
          done
          echo "  索引收录: $idx_ok 个OK / $idx_bad 个缺失"
          if [ "$idx_bad" -gt 0 ]; then
            echo "::error::仍有 $idx_bad 个包未被 packageinfo 收录，需检查这些包的 Makefile 是否可被 metadata 解析"
          fi

      - name: 重建配置并补齐插件（拍平后）
        run: |
          cd openwrt
          echo "===== 拍平后 package/ 可用包 ====="
          ls -d package/*/ 2>/dev/null | while read d; do
            n=$(basename "$d")
            if [ -f "package/$n/Makefile" ]; then echo "  $n"; fi
          done

          #★ 关键（v8 教训）：拍平后 .config 里的包名可能因 defconfig 重新解析而丢失。
          #   v8 实测：package/luci-app-passwall/Makefile明明存在，
          #   但defconfig 后 config 里只剩 25 个 luci-app（官方 83个），
          #   丢了 62 个（turboacc/ddns/transmission/wireguard/zerotier/openvpn…）。
          #
          # 做法：以 haiibo 原始 config 为准，逐条强制写回，再 defconfig。
          #      写回时若该包在本仓库不存在（defconfig 会忽略），会打印出来便于核对。
          cp .config .config.step8.bak 2>/dev/null || true
          echo "===== 强制写回 haiibo config 中的所有 CONFIG_PACKAGE ====="
          rewritten=0
          while IFS= read -r line; do
            case "$line" in
              CONFIG_PACKAGE_*=y|CONFIG_PACKAGE_*=m|CONFIG_PACKAGE_*="? *"*)
                k="${line%%=*}"
                # 先删掉旧行再写回，确保位置正确
                sed -i "/^${k}=/d;/^# ${k} is not set$/d" .config
                echo "$line" >> .config
                rewritten=$((rewritten+1))
                ;;
            esac
          done < .config.step8.bak
          echo "  已写回$rewritten 条 CONFIG_PACKAGE"

          echo "===== defconfig x2 ====="
          # ★ v10 修复：写回之前先清索引。这一步是本次修复的核心。
          #   v9 实测：写回 762 条 CONFIG_PACKAGE 后 defconfig 又全部丢弃，
          #   原因是 package/ 下的包从未进入 tmp/.packageinfo，
          #   Kconfig 不认识这些符号 -> 写进去的行被当未知行静默丢掉。
          rm -f tmp/.packageinfo tmp/.config-package.in
          make defconfig >/dev/null 2>&1 || true
          # 第二遍前再次回写（第一遍 defconfig 可能又清掉了没被解析的）
          while IFS= read -r line; do
            case "$line" in
              CONFIG_PACKAGE_*=y)
                k="${line%%=*}"
                if ! grep -q "^${k}=" .config; then
                  echo "$line" >> .config
                fi
                ;;
            esac
          done < .config.step8.bak
          make defconfig >/dev/null 2>&1 || true

          # ★ v11：自包含分层校验（不依赖 .github/scripts 外部文件）
          #   背景：v10 两次因 `bash .github/scripts/verify-packages.sh` 找不到而 exit 127。
          #   根本原因是本workflow 没有 actions/checkout，runner 工作目录下
          #   根本没有 .github/ 目录。此处把逻辑内嵌，彻底消除该依赖。
          #
          #   分层策略（按用户要求）：
          #     L1 致命闸门 —— 科学上网核心插件必须齐全且为上游最新
          #                      （passwall/passwall2/openclash/ssr-plus/mosdns/smartdns）
          #     L2 软告警 —— 其它插件缺任何一个都只警告，不阻断编译
          #     L3 无条件继续 —— 无论 L1/L2 结果如何都进入编译，绝不因计数失败误杀
          echo "=========================================="
          echo " v11 分层校验"
          echo "=========================================="

          # ---------- 强制重建索引（根因修复，v10 已验证有效）----------
          rm -f tmp/.packageinfo tmp/.config-package.in
          make defconfig >/dev/null 2>&1 || true

          # ---------- L1：科学上网核心（致命）----------
          CRITICAL="luci-app-passwall luci-app-passwall2 luci-app-openclash luci-app-ssr-plus luci-app-mosdns luci-app-smartdns luci-app-alist"
          echo "----- L1 科学上网核心（缺任一则终止）-----"
          L1_FAIL=0
          for k in $CRITICAL; do
            if grep -qE "^CONFIG_PACKAGE_${k}=y" .config 2>/dev/null; then
              echo "  ✓ $k"
            else
              # 再试一次：强制写回 + defconfig（kconfig 首遍可能未扫描到）
              echo "CONFIG_PACKAGE_${k}=y" >> .config
              L1_FAIL=$((L1_FAIL+1))
              echo "  ! $k 首遍未收录，已补写待重解析"
            fi
          done
          if [ "$L1_FAIL" -gt 0 ]; then
            make defconfig >/dev/null 2>&1 || true
            echo "  -- 重解析后复查 --"
            for k in $CRITICAL; do
              if grep -qE "^CONFIG_PACKAGE_${k}=y" .config 2>/dev/null; then
                echo "    ✓ $k 已恢复"
              else
                echo "    ✗ $k 仍缺失 → 终止"
              fi
            done
            remain=$(for k in $CRITICAL; do grep -qE "^CONFIG_PACKAGE_${k}=y" .config 2>/dev/null || echo "$k"; done | wc -w)
            if [ "$remain" -gt 0 ]; then
              echo "::error::科学上网核心插件缺失: $(for k in $CRITICAL; do grep -qE "^CONFIG_PACKAGE_${k}=y" .config 2>/dev/null || echo $k; done | tr '\n' ' ')"
              exit 1
            fi
          fi
          echo "  ✓ L1 全部通过"

          # ---------- L2：整体覆盖率（仅告警）----------
          echo "----- L2 插件覆盖率（仅告警，不阻断）-----"
          IN_INDEX=$(grep -c "^Package: " tmp/.packageinfo 2>/dev/null || true)
          IN_CFG=$(grep -cE "^CONFIG_PACKAGE_luci-app-[a-zA-Z0-9_-]+=y" .config 2>/dev/null || true)
          IN_CFG=${IN_CFG:-0}
          echo "  packageinfo 收录包数: ${IN_INDEX:-0}"
          echo "  config 中luci-app: $IN_CFG"
          if [ "$IN_CFG" -lt 80 ]; then
            echo "  ::warning::luci-app 数量 $IN_CFG 偏少（官方基线 123 条目/ 83 独立插件）"
            echo "  ::warning::缺失清单（不阻断，继续编译）:"
            for k in luci-app-turboacc luci-app-ddns luci-app-transmission luci-app-wireguard \
                     luci-app-zerotier luci-app-frpc luci-app-frps luci-app-openvpn-server \
                     luci-app-v2ray-server luci-app-kodexplorer luci-app-verysync \
                     luci-app-nps luci-app-rclone luci-app-qbittorrent luci-app-diskman; do
              if ! grep -qE "^CONFIG_PACKAGE_${k}=y" .config 2>/dev/null; then
                echo "      - $k"
              fi
            done
            echo "  ::warning::继续编译（这些缺失不会导致编译失败）"
          else
            echo "  ✓ L2 覆盖率正常"
          fi

          # ---------- L3：科学上网插件版本新鲜度（仅告警）----------
          echo "----- L3 科学上网插件版本（仅告警）-----"
          for d in package/luci-app-passwall package/luci-app-passwall2 package/luci-app-openclash package/luci-app-ssr-plus; do
            if [ -f "$d/Makefile" ]; then
              v=$(grep -m1 -E '^PKG_VERSION' "$d/Makefile" 2>/dev/null | cut -d= -f2 | tr -d ' ')
              echo "  $(basename $d): ${v:-未知}"
            fi
          done
          echo "=========================================="

      # ============================================================
      # ★ 核心修复：armvirt → armsr/armv8
      # ============================================================
      - name: 锁定编译目标为 armsr/armv8（核心修复）
        run: |
          cd openwrt
          sed -i '/^CONFIG_TARGET_armvirt/d' .config
          for kv in \
            "CONFIG_TARGET_armsr=y" \
            "CONFIG_TARGET_armsr_armv8=y" \
            "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y" \
            "CONFIG_TARGET_BOARD=armsr" \
            "CONFIG_TARGET_SUBTARGET=armv8" \
            "CONFIG_TARGET_ARCH_PACKAGES=\"armsr-armv8\"" \
            "CONFIG_TARGET_ARCH=aarch64_generic" \
            "CONFIG_TARGET_MULTILIB=y" \
            "CONFIG_TARGET_ALL_KERNELARCHS=y" \
            "CONFIG_TARGET_ARCH_WORDSIZE=64" \
            ; do
            k="${kv%%=*}"; v="${kv#*=}"
            sed -i "/^${k}=/d;/^# ${k} is not set$/d" .config
            echo "${k}=${v}" >> .config
          done
          make defconfig

          # ------------------------------------------------------------
          # ★ 关键修复（v4）：haiibo 的 armv8-plus.config 把所有 rootfs
          #   格式都禁用了：
          #     # CONFIG_TARGET_ROOTFS_CPIOGZ is not set
          #     # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
          #     # CONFIG_TARGET_IMAGES_GZIP is not set
          #   而 armsr 的 FEATURES 明明写着 "cpiogz ext4 ramdisk squashfs targz"，
          #   rootfs.tar.gz 正是由 targz 产出。全部禁用 => make 正常跑完、
          #   target/install 也执行，但 bin/targets/armsr/armv8/ 下**一个文件都没有**。
          #   这就是 v3 编了2.5 小时却在第13步"未找到 rootfs"的真正原因。
          # ------------------------------------------------------------
          echo "===== 启用 rootfs 输出格式 ====="
          #★ 关键：真正控制 rootfs.tar.gz 的是 CONFIG_TARGET_ROOTFS_TARGZ
          #（include/image.mk: `ifdef CONFIG_TARGET_ROOTFS_TARGZ / define Image/Build/targz`
          #   且 kernel_prepare 阶段会直接 `$(call Image/Build/targz)`）。
          #   v3 失败就是因为 haiibo config 里没有这一项。
          for kv in \
            "CONFIG_TARGET_ROOTFS_TARGZ=y" \
            "CONFIG_TARGET_ROOTFS_CPIOGZ=y" \
            "CONFIG_TARGET_ROOTFS_EXT4FS=y" \
            "CONFIG_TARGET_ROOTFS_SQUASHFS=y" \
            "CONFIG_TARGET_IMAGES_GZIP=y" \
            ; do
            k="${kv%%=*}"; v="${kv#*=}"
            sed -i "/^${k}=/d;/^# ${k} is not set$/d" .config
            echo "${k}=${v}" >> .config
          done
          make defconfig
          echo "--- 生效确认（应全部 =y）---"
          for k in CONFIG_TARGET_ROOTFS_TARGZ CONFIG_TARGET_ROOTFS_CPIOGZ \
                   CONFIG_TARGET_ROOTFS_SQUASHFS CONFIG_TARGET_IMAGES_GZIP; do
            grep -E "^${k}=" .config || echo "MISS $k"
          done

          echo "===== target 校验 ====="
          fail=0
          for k in CONFIG_TARGET_armsr CONFIG_TARGET_armsr_armv8 \
                   CONFIG_TARGET_armsr_armv8_DEVICE_generic CONFIG_TARGET_BOARD CONFIG_TARGET_SUBTARGET; do
            if grep -qE "^${k}=" .config; then
              echo "OK   $(grep -E "^${k}=" .config)"
            else
              echo "MISS $k"; fail=1
            fi
          done
          echo "----- ARCH -----"
          grep -E '^CONFIG_TARGET_(ARCH|ARCH_PACKAGES|ARCH_WORDSIZE)' .config || true
          echo "----- ROOTFS 格式（关键，必须为 y 才有产出）-----"
          for k in CONFIG_TARGET_ROOTFS_CPIOGZ CONFIG_TARGET_ROOTFS_SQUASHFS CONFIG_TARGET_IMAGES_GZIP; do
            if grep -qE "^${k}=y" .config; then echo "OK   $k=y"; else echo "MISS $k"; fail=1; fi
          done
          echo "----- 确认没有 x86 混入 -----"
          if grep -qE '^CONFIG_TARGET_(x86|PC|x86_64)' .config; then
            echo "::error::x86 target 混入！"; fail=1
          else
            echo "OK   无 x86"
          fi
          [ $fail -eq 0 ] || { echo "::error::配置不完整，终止"; exit 1; }
          echo "== target + rootfs 格式锁定成功 =="

          # ★ v11：target 锁定会再跑 make defconfig，可能把插件挤掉。
          #   这里做自包含的兜底复检：L1 科学上网核心缺失才终止，L2 仅告警。
          echo "===== target 锁定后插件复检 ====="
          rm -f tmp/.packageinfo tmp/.config-package.in
          make defconfig >/dev/null 2>&1 || true

          CRITICAL="luci-app-passwall luci-app-passwall2 luci-app-openclash luci-app-ssr-plus luci-app-mosdns luci-app-smartdns luci-app-alist"
          need_rb=0
          for k in $CRITICAL; do
            if ! grep -qE "^CONFIG_PACKAGE_${k}=y" .config 2>/dev/null; then
              echo "CONFIG_PACKAGE_${k}=y" >> .config
              need_rb=$((need_rb+1))
            fi
          done
          if [ "$need_rb" -gt 0 ]; then
            echo "  补写 $need_rb 条，重跑 defconfig"
            make defconfig >/dev/null 2>&1 || true
          fi

          miss=""
          for k in $CRITICAL; do
            if grep -qE "^CONFIG_PACKAGE_${k}=y" .config 2>/dev/null; then
              echo "  ✓ $k"
            else
              echo "  ✗ $k"
              miss="$miss $k"
            fi
          done
          if [ -n "$miss" ]; then
            echo "::error::target 锁定后科学上网核心仍缺失:$miss"
            exit 1
          fi
          echo "  ✓ L1 复检通过"

          cnt=$(grep -cE "^CONFIG_PACKAGE_luci-app-[a-zA-Z0-9_-]+=y" .config 2>/dev/null || true)
          echo "  当前 config 内 luci-app: ${cnt:-0}（仅供参考，不作闸门）"

      - name: 移除 haiibo 的 ARM 编译参数覆盖
        run: |
          cd openwrt
          # armv8-plus.config 的 CONFIG_TARGET_OPTIMIZATION 带 -march=armv8-a+crypto，
          # 会污染 host 版 libgcc 编译 -> cannot compute suffix of object files
          sed -i '/^CONFIG_TARGET_OPTIMIZATION=/d' .config
          sed -i 's#^CONFIG_PACKAGE_adb=y#\# CONFIG_PACKAGE_adb is not set#' .config
          grep -E '^CONFIG_TARGET_OPTIMIZATION|^#? CONFIG_PACKAGE_adb( |$)' .config || true

      - name: 启用 perl 模块
        run: |
          cd openwrt
          for s in CONFIG_PACKAGE_perlbase-file CONFIG_PACKAGE_perlbase-getopt \
                   CONFIG_PACKAGE_perlbase-time CONFIG_PACKAGE_perlbase-unicode \
                   CONFIG_PACKAGE_perlbase-utf8; do
            sed -i "/^# ${s} is not set$/d" .config
            grep -q "^${s}=" .config || echo "${s}=y" >> .config
          done

      - name: 补齐 F 大打包必选包
        run: |
          cd openwrt
          has_symbol() { grep -qE "^CONFIG_PACKAGE_${1}=|^# CONFIG_PACKAGE_${1} is not set" .config; }
          force_pkg() {
            if has_symbol "$1"; then
              sed -i "/^# CONFIG_PACKAGE_${1} is not set$/d" .config
              grep -q "^CONFIG_PACKAGE_${1}=" .config || echo "CONFIG_PACKAGE_${1}=y" >> .config
              echo "OK   $1"
            else
              echo "::warning::CONFIG_PACKAGE_$1 不存在，跳过"
            fi
          }
          for p in e2fsprogs mkf2fs perl perlbase-file perlbase-getopt perlbase-time \
                   perlbase-unicode perlbase-utf8 blkid fdisk lsblk parted attr btrfs-progs \
                   chattr dosfstools f2fs-tools f2fsck lsattr xfs-fsck xfs-mkfs bsdtar pigz \
                   bash gawk getopt losetup tar uuidgen acpid kmod-brcmfmac kmod-brcmutil \
                   kmod-cfg80211 kmod-mac80211 hostapd-common iw wpad; do
            force_pkg "$p"
          done
          # 消除 kmod-oaf 递归依赖告警（destan19/OpenAppFilter 的 Kconfig 自我 select）
          sed -i '/^CONFIG_PACKAGE_kmod-oaf=y/d' .config
          make defconfig
          echo "== 最终自检 =="
          miss=0
          for p in perl perlbase-file perlbase-getopt perlbase-time perlbase-unicode perlbase-utf8 \
                   blkid fdisk lsblk parted attr btrfs-progs chattr dosfstools e2fsprogs f2fs-tools \
                   f2fsck lsattr mkf2fs xfs-fsck xfs-mkfs bsdtar pigz bash gawk getopt losetup tar \
                   uuidgen acpid kmod-brcmfmac kmod-brcmutil kmod-cfg80211 kmod-mac80211 \
                   hostapd-common iw wpad; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || { echo "MISS ${p}"; miss=1; }
          done
          [ $miss -eq 0 ] && echo "必选包自检通过" || echo "::warning::有包缺失"
          echo "===== 再次确认 target 未被 defconfig 丢掉 ====="
          grep -E '^CONFIG_TARGET_(armsr|BOARD|SUBTARGET|ARCH)=' .config
          # ★ 最后一道防线：确认 rootfs 输出格式仍在（defconfig 可能重置）
          echo "===== 再次确认 rootfs 格式未被丢掉 ====="
          rmiss=0
          for k in CONFIG_TARGET_ROOTFS_TARGZ CONFIG_TARGET_IMAGES_GZIP; do
            if grep -qE "^${k}=y" .config; then echo "OK   $k=y"; else echo "MISS $k（重新写入并 defconfig）"; rmiss=1; fi
          done
          if [ "$rmiss" -ne 0 ]; then
            echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
            echo "CONFIG_TARGET_IMAGES_GZIP=y" >> .config
            make defconfig
            echo "--- 补写后 ---"; grep -E '^CONFIG_TARGET_ROOTFS_TARGZ=|^CONFIG_TARGET_IMAGES_GZIP=' .config
          fi

      - name: 编译
        env:
          # ★ v10 提速：让 make 实际走ccache。
          #   装了 ccache 包不等于会用，必须把 CCACHE 打开并写进 .config。
          #   HOSTCC/SUPPORTED_CCACHE 让主机侧工具也走缓存。
          USE_CCACHE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          HOSTCC: "ccache gcc"
          HOSTCXX: "ccache g++"
          HOSTCCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cd openwrt
          # ★ v11 修复：CCACHE_DIR 目录必须先创建。
          #   v10/v11 实测：缓存 restore 步骤在缓存未命中时不会建目录，
          #   导致 `ccache -M 20G` 直接失败，step 在 12 秒内 exit 1，
          #   日志只到 CONFIG_CCACHE_DIR="" 就断，看不出原因。
          mkdir -p "$CCACHE_DIR" "$CCACHE_DIR/tmp" 2>/dev/null || true
          echo "CCACHE_DIR=$CCACHE_DIR 存在=$([ -d "$CCACHE_DIR" ] && echo yes || echo no)"

          # 把 ccache 写进 .config，确保内核与包都启用
          grep -q '^CONFIG_CCACHE=y' .config || echo "CONFIG_CCACHE=y" >> .config
          grep -q '^CONFIG_CCACHE_HOSTCC=y' .config || echo "CONFIG_CCACHE_HOSTCC=y" >> .config
          make defconfig >/dev/null 2>&1 || true
          grep -E '^CONFIG_CCACHE' .config || true

          export PATH="$CCACHE_DIR:$PATH"
          export CCACHE_DISABLE=0
          export CCACHE_DIR="$CCACHE_DIR"
          export CCACHE_TEMPDIR="$CCACHE_DIR/tmp"
          # 以下 ccache 命令一律不让失败中断 step（-e 下会直接退出）
          ccache -M 20G || echo "::warning::ccache -M 失败（忽略）"
          ccache -z || echo "::warning::ccache -z 失败（忽略）"
          ccache -s 2>/dev/null | head -8 || echo "::warning::ccache -s 失败（忽略）"
          echo "CPU 核数: $(nproc)"

          set -o pipefail
          make -j$(nproc) download 2>&1 | tee /tmp/download.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行 download 有失败项，串行重试"
            make download 2>&1 | tee /tmp/download2.log
            rc2=${PIPESTATUS[0]}
            [ "$rc2" -ne 0 ] && { echo "::error::download 持续失败"; grep -naE "Failed to download|wget returned" /tmp/download2.log | tail -20 || true; exit 1; }
          fi
          echo "== 开始编译（历史实测 2h22m，本次插件补齐后预计 2.5~4h，上限 340min）=="
          # 记录编译起始时间，结束后算耗时，便于后续调优
          T0=$(date +%s)
          # 用 PIPESTATUS 判定，不能用 `if ! cmd | tee`（bash 中 ! 作用于 tee 的退出码）
          make -j$(nproc) 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::编译失败（rc=$rc），错误摘要："
            grep -naE '(^|: )(error|Error|ERROR):|No such file|cannot |undefined reference|Build failed' /tmp/build.log | tail -40 || true
            exit 1
          fi
          echo "== 编译完成 =="

          # ★ v10 新增：耗时与缓存命中率统计（用于后续调优/ 判断是否超6h）
          T1=$(date +%s)
          echo "===== 编译耗时统计 ====="
          echo "  编译阶段耗时: $(( (T1-T0)/60 )) 分钟 $(( (T1-T0)%60 )) 秒"
          echo "  当前时间: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "----- ccache 命中率 -----"
          ccache -s2>/dev/null | head -12 || true
          echo "----- dl 缓存大小 -----"
          du -sh dl 2>/dev/null || true

          # ★ 最终保险：编译前最后确认 config 里插件还在。
          #   defconfig 可能清掉未被 kconfig 识别的条目，
          #   而 package/ 下的第三方插件是拍平后才出现的，kconfig 需要重新扫描。
          n2=$(grep -cE "^CONFIG_PACKAGE_luci-app-[a-zA-Z0-9_-]+=y" .config 2>/dev/null || true)
          n2=${n2:-0}
          echo "  编译时 config 内 luci-app: $n2"
          if [ "$n2" -lt 70 ]; then
            echo "::warning::编译时 luci-app 仅 $n2 个（<70），插件可能被 defconfig 丢弃"
            echo "::warning::尝试从备份回写一次并再跑 defconfig"
            if [ -f .config.step8.bak ]; then
              while IFS= read -r line; do
                case "$line" in
                  CONFIG_PACKAGE_luci-app-*=y)
                    k="${line%%=*}"
                    if ! grep -q "^${k}=" .config; then echo "$line" >> .config; fi
                    ;;
                esac
              done < .config.step8.bak
              make defconfig >/dev/null 2>&1 || true
              n3=$(grep -cE "^CONFIG_PACKAGE_luci-app-[a-zA-Z0-9_-]+=y" .config 2>/dev/null || true)
              echo "  回写后: ${n3:-0}"
            fi
          fi

          #★ 硬校验：确认第三方插件真的被编译了。
          #   v4 的教训：make 全程 success，但 60+ 插件一个没编，rootfs 只有 148MB。
          echo "===== 校验第三方插件是否真的被编译 ====="
          ifgrep=$(grep -cE "\-C package/luci-app-passwall|\-C package/luci-app-openclash" /tmp/build.log 2>/dev/null || true)
          ifgrep=${ifgrep:-0}
          pkgipk=$(find bin -name 'luci-app-*.ipk' 2>/dev/null | wc -l)
          echo "  build.log 中 package/luci-app-* 编译记录: $ifgrep"
          echo "  产出的 luci-app-*.ipk 数: $pkgipk"
          if [ "$pkgipk" -lt 60 ]; then
            echo "::error::luci-app ipk 产出过少（$pkgipk < 10），插件多半未进入编译"
            echo "::error::bin 下 luci-app ipk 列表："
            find bin -name 'luci-app-*.ipk' 2>/dev/null | head -20
            exit 1
          fi
          echo "  ✓ 插件已参与编译"

      # ============================================================
      # ★ 架构硬校验 + targz rootfs 生成（v4 关键修复）
      # ============================================================
      - name: 生成 targz rootfs 并校验产物
        run: |
          cd openwrt
          # ------------------------------------------------------------
          # v3 失败原因：bin/targets/armsr/armv8/ 下【一个文件都没有】。
          #   原因有二：
          #     (1) haiibo config 把所有 rootfs 格式禁用（已在上一步开启）
          #     (2) armsr/image/Makefile 只定义了 Build/combined（EFI 镜像），
          #         没有 rootfs-targz 目标，所以默认 make 不会产出 rootfs.tar.gz。
          #   而 flippy 打包必须要这个文件（脚本里写死 PACKAGE_FILE=
          #   "openwrt-armsr-armv8-generic-rootfs.tar.gz"，仅拷贝不生成）。
          # 解法：显式调用 Build/rootfs-targz 目标。
          # ------------------------------------------------------------

          echo "===== 当前 bin/targets 状态 ====="
          find bin/targets -maxdepth 3 2>/dev/null | head -20 || true

          # 开启 CONFIG_TARGET_ROOTFS_TARGZ 后，make 的 kernel_prepare 阶段
          # 会自动执行 `$(call Image/Build/targz)`，正常情况下产物已存在。
          # 兜底：若仍无，再显式调一次。
          if ! ls bin/targets/armsr/armv8/*rootfs*.tar.gz >/dev/null 2>&1; then
            echo "::notice::未找到 targz rootfs，尝试显式make image"
            make image V=s 2>&1 | tee /tmp/image.log || {
              echo "::warning::make image 返回非零，继续用现有产物查找"
            }
          else
            echo "::notice::已找到 targz rootfs，跳过 make image"
            touch /tmp/image.log
          fi

          echo "===== 生成后的产物 ====="
          ls -lh bin/targets/armsr/armv8/ 2>/dev/null || true
          find bin -name '*rootfs*' 2>/dev/null | head -10 || true

          # ---- 架构硬校验 ----
          if [ -d bin/targets/x86 ]; then
            echo "::error::检测到 bin/targets/x86 —— 编成了 x86 而非 ARM"
            exit 1
          fi

          # ---- 定位 rootfs（兼容多种命名）----
          f=""
          for cand in \
            bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz \
            bin/targets/armsr/armv8/*rootfs*.tar.gz \
            bin/targets/armsr/armv8/*rootfs*.img \
            bin/targets/armsr/armv8/*combined*.img.gz ; do
            if [ -f "$cand" ]; then f="$cand"; break; fi
          done
          if [ -z "$f" ]; then
            f=$(find bin -name '*rootfs*.tar.gz' -size +1M 2>/dev/null | head -n1)
          fi
          if [ -z "$f" ]; then
            f=$(find bin -name '*.img*' -size +10M 2>/dev/null | head -n1)
          fi

          if [ -z "$f" ]; then
            echo "::error::仍未找到任何 rootfs / 镜像产物。"
            echo "::error:: bin/targets/armsr/armv8/ 实际内容："
            ls -laR bin/targets/armsr/ 2>/dev/null | head -40 || true
            echo "::error:: 可用 Build 目标："
            grep -oE "^define Build/[a-z-]+" target/linux/armsr/image/Makefile include/image.mk 2>/dev/null
            exit 1
          fi

          # v4 失败点修正：统一把产物落到固定绝对路径 /tmp/rootfs/，
          # 并把【绝对路径】写入 rootfs_path.txt。
          # 上一版写的是 bin/targets/... 这样的相对路径，而下一 step不再 cd openwrt，
          # 导致 `test -f` 判定"路径失效"（rootfs 其实已 copy 到 /tmp/rootfs/ 了）。
          mkdir -p /tmp/rootfs
          FINAL=/tmp/rootfs/openwrt-armsr-armv8-generic-rootfs.tar.gz
          echo "== 复制到固定位置 =="
          cp -vf "$f" "$FINAL"
          rm -f /tmp/rootfs/*.img /tmp/rootfs/*.img.gz 2>/dev/null || true

          sz=$(du -b "$FINAL" | awk '{print $1}')
          echo "FOUND_ROOTFS=$FINAL  size=$sz"
          [ "$sz" -ge 10485760 ] || { echo "::error::产物过小（<10MB），疑似损坏"; exit 1; }
          echo "== /tmp/rootfs 内容 =="
          ls -lh /tmp/rootfs/
          echo "$FINAL" > /tmp/rootfs_path.txt

      - name: 取出 rootfs（校验）
        run: |
          set -e
          f=$(cat /tmp/rootfs_path.txt)
          echo "rootfs 路径: $f"
          test -f "$f" || { echo "::error::rootfs 不存在: $f"; exit 1; }
          ls -lh "$f"
          # 校验是合法的 gzip tar
          tar tzf "$f" >/dev/null 2>&1 || { echo "::error::rootfs 不是有效的 tar.gz"; exit 1; }
          echo "rootfs 校验通过"

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: |
            /tmp/build.log
            /tmp/image.log
          retention-days: 14

      - name: 上传 rootfs
        uses: actions/upload-artifact@v5
        with:
          name: openwrt-rootfs
          path: /tmp/rootfs/openwrt-armsr-armv8-generic-rootfs.tar.gz
          compression-level: 0
          retention-days: 3

  package:
    name: 2. F 大脚本打包 N1 + X96Max+
    needs: [build-rootfs]
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 rootfs
        uses: actions/download-artifact@v5
        with:
          name: openwrt-rootfs
          path: rootfs

      - name: 安装打包依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y btrfs-progs dosfstools e2fsprogs util-linux uuid-runtime \
            fdisk parted gawk tar pigz p7zip-full rsync wget curl
          ls -lh rootfs/

      - name: 调用 F 大打包脚本
        uses: ophub/flippy-openwrt-actions@main
        env:
          PACKAGE_SOC: s905x3_s905d
          # v4：文件名与 flippy 脚本内 PACKAGE_FILE 保持一致
          OPENWRT_ARMSR: rootfs/openwrt-armsr-armv8-generic-rootfs.tar.gz
          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: ${{ inputs.kernel_version }}
          KERNEL_AUTO_LATEST: 'true'
          WHOAMI: Haiibo
          OPENWRT_VER: ${{ inputs.openwrt_ver }}
          DISTRIB_REVISION: ${{ inputs.openwrt_ver }}
          OPENWRT_IP: 192.168.1.1
          GZIP_IMGS: gz

      - name: 收集产物
        run: |
          mkdir -p firmware
          cp -v "${PACKAGED_OUTPUTPATH}"/*.img.gz firmware/ 2>/dev/null || true
          cp -v "${PACKAGED_OUTPUTPATH}"/*.sha256 firmware/ 2>/dev/null || true
          if [ -z "$(ls -A firmware)" ]; then
            echo "::error::没有产出镜像，请翻日志找报错"
            exit 1
          fi
          ls -lh firmware/

      - name: 发布到 Release
        uses: ncipollo/release-action@v1
        with:
          tag: OpenWrt-Flippy-v3
          name: "OpenWrt v3 (armsr/armv8) for N1 & X96Max+"
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: false
          artifacts: firmware/*
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### 本次编译（v3·armsr/armv8 修正版）
            - target: **armsr / armv8**（原 armvirt/64 已于 2025-04-28 更名）
            - LEDE commit: 已锁定，可复现
            - 插件集: haiibo ARMv8_PLUS
            - 内核: ${{ inputs.kernel_version }}
            - 目标: s905x3 (X96Max+ 等) 、 s905d (Phicomm N1)
            - 默认地址/密码: 192.168.1.1 / password
            - 刷机: U 盘启动 → 系统 → 晶晨宝盒 → 安装 OpenWrt